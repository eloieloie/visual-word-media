name: Deploy Backend via SFTP

on:
  push:
    branches:
      - master
    paths:
      - 'vwm_backend/**'

jobs:
  sftp-deploy:
    name: Upload vwm_backend to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: pressable/github-action-sftp-deploy@v2.2.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          pass: ${{ secrets.FTP_PASS }}
          local_path: ./vwm_backend/
          remote_path: /vwm_backend/
          args: -avz --delete --exclude='init_db.php' --exclude='.git*'
          port: 22
