name: Deploy Backend via FTP

on:
  push:
    branches:
      - master
    paths:
      - 'vwm_backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:   # allow manual "Run workflow" from any branch

jobs:
  ftp-deploy:
    name: Upload vwm_backend to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate config/secrets.php from GitHub secret
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
        run: |
          {
            echo '<?php'
            echo "// Generated by CI from the MAILGUN_API_KEY GitHub secret. Do not commit."
            echo "putenv('MAILGUN_API_KEY=${MAILGUN_API_KEY}');"
          } > vwm_backend/config/secrets.php

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./vwm_backend/
          server-dir: ./
          exclude: |
            **/init_db.php
            **/.git*
            **/.ftp-deploy-sync-state.json
